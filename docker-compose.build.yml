# 本地源码构建（开发者 / 修改代码测试用）：
#   docker compose -f docker-compose.build.yml up -d --build
services:
  codebuddy-proxy:
    build: .
    image: codebuddy-proxy:local
    container_name: codebuddy-proxy
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # - API_KEY=your_secret_key
      - TZ=Asia/Shanghai
      - WB_UPDATE_REPO=bachelor-dou/codebuddy-proxy
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage
