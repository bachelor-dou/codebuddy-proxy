# CodeBuddy Proxy Docker Compose
# 部署：docker compose up -d --build
# 更新：git pull --ff-only && docker compose up -d --build
services:
  codebuddy-proxy:
    build: .
    image: codebuddy-proxy:local
    container_name: codebuddy-proxy
    restart: unless-stopped
    # Defaults to root (0:0), i.e. the historical behaviour. To run as your own
    # host user instead, set PUID/PGID (e.g. PUID=$(id -u) PGID=$(id -g)
    # docker compose up -d) and make sure ./accounts and ./usage are writable
    # by that uid; see the README's Docker section.
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      # 宿主机端口:容器端口（右侧必须与下面的 PORT 保持一致）
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # 留空则启动时自动生成高强度 API Key 写入 ./accounts/settings.json 并打印在启动日志中
      # - API_KEY=your_secret_key
      - TZ=Asia/Shanghai
      - WB_UPDATE_REPO=bachelor-dou/codebuddy-proxy
    volumes:
      # 持久化数据目录：升级与重建容器时绝不丢失配置与用量
      - ./accounts:/app/accounts
      - ./usage:/app/usage
